<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tomi V-P</title>
  <style>
    /* General Reset */
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #e0f7fa, #ffecb3);
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5em;
      color: #00796b;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
    }

    p {
      font-size: 1.2rem;
      line-height: 1.6;
      margin: 0.5em 0;
      color: #5d4037;
    }

    .content-box {
      background: rgba(255, 255, 255, 0.8);
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      max-width: 600px;
    }

    footer {
      margin-top: 2em;
      font-size: 0.9rem;
      color: #757575;
    }

    a {
      color: #00796b;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    /* Add a smooth animation on hover for links */
    a {
      transition: color 0.3s ease-in-out;
    }
  </style>
</head>
<body>
  <div class="content-box">
    <h1>Tämä on minun Githubissa oleva sivu</h1>
    <p>Tässä on hiukan tekstiä vai onko?</p>
    <p>Lisää tekstiä tässä alhaalla, toivottavasti</p>
  </div>
  <footer>
    <p>Tehnyt <a href="https://github.com/">Tomi V-P</a>. Kiitos vierailusta!</p>
  </footer>
</body>
</html>
